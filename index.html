/* =========================================================================
   Drag & drop reorder (pointer-based, touch friendly)
   ========================================================================= */
/* Après un vrai glisser (vertical ou horizontal), le navigateur envoie quand même un événement
   "click" juste après le relâchement — sur l'élément qui se trouve maintenant sous le doigt,
   qui n'est plus forcément le même qu'au départ après un réordonnancement. Sans ça, la tâche
   qui atterrit à l'emplacement d'origine se retrouvait éditée par erreur.
   On ne bloque que ce clic immédiat (fenêtre très courte) : un vrai tap séparé juste après,
   par exemple sur "modifier" une fois les boutons révélés, doit rester fonctionnel du premier coup. */
let lastGestureEndTime = 0;
document.addEventListener("click", (e)=>{
  if(performance.now() - lastGestureEndTime < 80){
    e.stopPropagation();
    e.preventDefault();
  }
}, true);

function startMomentumScroll(appEl, velocity){
  // velocity en px/ms ; on la laisse s'amortir avec un peu de friction, comme un scroll natif.
  let v = velocity;
  function step(){
    v *= 0.94;
    if(Math.abs(v) < 0.02) return;
    appEl.scrollTop -= v * 16;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function closeSwipeRow(row){
  const content = row.querySelector(".swipe-content");
  if(content){
    content.style.transition = "transform .2s ease";
    content.style.transform = "translateX(0)";
  }
  row.classList.remove("swiped-open");
}
function closeOtherSwipes(exceptRow){
  document.querySelectorAll(".swiped-open").forEach(row=>{
    if(row !== exceptRow) closeSwipeRow(row);
  });
}

const SWIPE_REVEAL_PX = 112;

/* Version simplifiée, glissement latéral uniquement (pas de réordonnancement vertical) —
   utilisée pour les habitudes, qui ne sont pas réordonnables. */
/* Glissement simple (sans réordonnancement) pour des item-row en dehors de la liste principale,
   comme les tâches récurrentes à venir. Les clics sur les boutons révélés (édit/suppr/étoile)
   sont déjà câblés globalement par makeDraggable ; cette fonction ne gère que le geste. */
function makeItemSwipeOnly(root, itemSelector){
  const DECIDE_PX = 10;
  root.querySelectorAll(itemSelector).forEach(item=>{
    const content = item.querySelector(".swipe-content");
    if(!content) return;
    item.addEventListener("pointerdown", (e)=>{
      if(e.target.closest("[data-checktask]") || e.target.closest(".swipe-btn") || e.target.closest("[data-inline-name]") || e.target.closest("textarea") || item.classList.contains("editing-lock") || e.target.isContentEditable) return;
      startSwipe(item, content, e.pointerId, e.clientX, e.clientY);
    });
  });

  function startSwipe(item, content, pointerId, downX, downY){
    let mode = null;
    let lastY = downY, lastMoveTime = performance.now(), velocity = 0;
    const actionsEl = item.querySelector(".swipe-actions");
    const revealPx = actionsEl ? actionsEl.offsetWidth : SWIPE_REVEAL_PX;
    const baseX = item.classList.contains("swiped-open") ? -revealPx : 0;

    function onMove(e){
      if(e.pointerId !== pointerId) return;
      const dx = e.clientX - downX, dy = e.clientY - downY;
      if(mode === null){
        const movedEnough = Math.abs(dx) > DECIDE_PX || Math.abs(dy) > DECIDE_PX;
        if(!movedEnough) return;
        if(Math.abs(dy) >= Math.abs(dx)){ mode = "scrolling"; }
        else { mode = "horizontal"; content.style.transition = "none"; }
      }
      e.preventDefault();
      if(mode === "scrolling"){
        const appEl = document.getElementById("app");
        const now = performance.now();
        const dt = Math.max(now - lastMoveTime, 1);
        velocity = (e.clientY - lastY) / dt;
        if(appEl) appEl.scrollTop -= (e.clientY - lastY);
        lastY = e.clientY; lastMoveTime = now;
        return;
      }
      const next = Math.min(0, Math.max(-revealPx, baseX + dx));
      content.style.transform = `translateX(${next}px)`;
    }
    function finish(e){
      if(e && e.pointerId !== pointerId) return;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", finish);
      document.removeEventListener("pointercancel", finish);
      if(mode) lastGestureEndTime = performance.now();
      if(mode === "scrolling" && Math.abs(velocity) > 0.05){
        const appEl = document.getElementById("app");
        if(appEl) startMomentumScroll(appEl, velocity);
      }
      if(mode === "horizontal"){
        content.style.transition = "transform .2s ease";
        const dx = (e && e.clientX != null ? e.clientX : downX) - downX;
        const next = baseX + dx;
        if(next < -revealPx/2){
          closeOtherSwipes(item);
          content.style.transform = `translateX(-${revealPx}px)`;
          item.classList.add("swiped-open");
        } else {
          content.style.transform = "translateX(0)";
          item.classList.remove("swiped-open");
        }
      }
    }
    document.addEventListener("pointermove", onMove, {passive:false});
    document.addEventListener("pointerup", finish);
    document.addEventListener("pointercancel", finish);
  }
}

/* Réordonnancement vertical (appui long 1s) ET glissement latéral (éditer/supprimer) réunis dans
   UN SEUL système de geste par élément — les gérer séparément créait des écouteurs concurrents
   qui se marchaient dessus. Chaque pointerdown ouvre une "session" qui, au premier mouvement net,
   choisit UNE fois pour toutes entre : scroll natif (vertical, on ne touche à rien), glisser pour
   réordonner (vertical, après 1s d'immobilité), ou glissement latéral (horizontal, si swipeHandlers
   est fourni). */
function makeDraggable(root, listSelector, itemSelector, storeKind, swipeHandlers, onReorderDone){
  const list = root.querySelector(listSelector);
  if(!list) return;

  const LONG_PRESS_MS = 650;
  const DECIDE_PX = 10;

  list.querySelectorAll(itemSelector).forEach(item=>{
    const content = item.querySelector(".swipe-content");
    item.addEventListener("pointerdown", (e)=>{
      if(e.target.closest("[data-checktask]") || e.target.closest("[data-checkproject]") || e.target.closest("select") || e.target.closest(".swipe-btn") || item.classList.contains("editing-lock") || e.target.isContentEditable) return;
      startGesture(item, content, e.pointerId, e.clientX, e.clientY);
    });
  });

  function startGesture(item, content, pointerId, downX, downY){
    let mode = null; // null | "vertical" | "horizontal" | "scrolling"
    let lastY = downY;
    let lastMoveTime = performance.now();
    let velocity = 0;
    const actionsEl = item.querySelector(".swipe-actions");
    const revealPx = actionsEl ? actionsEl.offsetWidth : SWIPE_REVEAL_PX;
    const baseX = item.classList.contains("swiped-open") ? -revealPx : 0;

    const itemsInitial = [...list.querySelectorAll(itemSelector)];
    const startIndex = itemsInitial.indexOf(item);
    let order = [...itemsInitial];
    const style = getComputedStyle(item);
    const rowHeight = item.offsetHeight + (parseFloat(style.marginBottom) || 0);

    // Si l'élément suivant est une tâche liée à celle-ci, elle voyage avec son "parent" pendant
    // le glisser vertical, pour ne jamais se retrouver séparée de la tâche dont elle dépend.
    const linkedChild = itemsInitial[startIndex+1] && itemsInitial[startIndex+1].dataset.linkedChild === "1" ? itemsInitial[startIndex+1] : null;
    const blockSize = linkedChild ? 2 : 1;

    function activateVertical(){
      if(mode !== null) return;
      mode = "vertical";
      item.classList.add("dragging");
      item.style.zIndex = 10;
      if(linkedChild){ linkedChild.classList.add("dragging"); linkedChild.style.zIndex = 10; }
    }
    const holdTimer = setTimeout(activateVertical, LONG_PRESS_MS);

    function onMove(e){
      if(e.pointerId !== pointerId) return;
      const dx = e.clientX - downX;
      const dy = e.clientY - downY;

      if(mode === null){
        const movedEnough = Math.abs(dx) > DECIDE_PX || Math.abs(dy) > DECIDE_PX;
        if(!movedEnough) return;
        if(Math.abs(dy) >= Math.abs(dx)){
          // Intention de scroll : les lignes bloquent le pan natif (touch-action:none, nécessaire
          // pour que le drag vertical fonctionne de façon fiable), donc on fait défiler #app
          // nous-mêmes pour que ça continue à scroller normalement.
          clearTimeout(holdTimer);
          mode = "scrolling";
        } else if(swipeHandlers && content){
          clearTimeout(holdTimer);
          mode = "horizontal";
          content.style.transition = "none";
        } else {
          return; // mouvement horizontal mais pas de swipe dispo ici : on attend le hold vertical
        }
      }

      if(mode === "scrolling"){
        e.preventDefault();
        const appEl = document.getElementById("app");
        const now = performance.now();
        const dt = Math.max(now - lastMoveTime, 1);
        velocity = (e.clientY - lastY) / dt;
        if(appEl) appEl.scrollTop -= (e.clientY - lastY);
        lastY = e.clientY;
        lastMoveTime = now;
        return;
      }

      if(mode === "horizontal"){
        e.preventDefault();
        const next = Math.min(0, Math.max(-revealPx, baseX + dx));
        content.style.transform = `translateX(${next}px)`;
        return;
      }

      if(mode === "vertical"){
        e.preventDefault();
        item.style.transform = `translateY(${dy}px)`;
        if(linkedChild) linkedChild.style.transform = `translateY(${dy}px)`;
        const shift = Math.round(dy / rowHeight);
        const targetIndex = Math.min(Math.max(startIndex + shift, 0), itemsInitial.length - blockSize);
        const currentIndex = order.indexOf(item);
        if(targetIndex !== currentIndex){
          const block = linkedChild ? [item, linkedChild] : [item];
          order.splice(currentIndex, block.length);
          order.splice(targetIndex, 0, ...block);
          itemsInitial.forEach((el, originalIdx)=>{
            if(el === item || el === linkedChild) return;
            const newIdx = order.indexOf(el);
            const offset = (newIdx - originalIdx) * rowHeight;
            el.style.transform = offset ? `translateY(${offset}px)` : "";
          });
        }
        // Défilement automatique près des bords : sans ça, descendre un élément vers le bas
        // de l'écran semblait "ne rien faire" dès qu'on atteignait le bord visible.
        const appEl = document.getElementById("app");
        if(appEl){
          const rect = appEl.getBoundingClientRect();
          const EDGE = 70;
          if(e.clientY < rect.top + EDGE) appEl.scrollTop -= 14;
          else if(e.clientY > rect.bottom - EDGE) appEl.scrollTop += 14;
        }
      }
    }

    function finish(e){
      if(e && e.pointerId !== pointerId) return;
      clearTimeout(holdTimer);
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", finish);
      document.removeEventListener("pointercancel", finish);
      if(mode === "vertical" || mode === "horizontal") lastGestureEndTime = performance.now();
      if(mode === "scrolling" && Math.abs(velocity) > 0.05){
        const appEl = document.getElementById("app");
        if(appEl) startMomentumScroll(appEl, velocity);
      }

      if(mode === "vertical"){
        // Applique l'ordre final au vrai DOM. Comme le transform de chaque ligne représentait déjà
        // exactement sa position finale, l'enlever juste après ne produit aucun saut visuel.
        order.forEach(el=> list.appendChild(el));
        itemsInitial.forEach(el=>{ el.style.transform = ""; el.style.zIndex = ""; });
        item.classList.remove("dragging");
        if(linkedChild) linkedChild.classList.remove("dragging");
        // Attendu avant tout le reste : sinon une action rapide juste après (éditer une tâche,
        // par exemple) pouvait lire l'ordre en base avant que l'écriture ne soit terminée.
        persistOrder(list, itemSelector, storeKind).then(()=>{
          if(onReorderDone) onReorderDone();
        });
      } else if(mode === "horizontal"){
        content.style.transition = "transform .2s ease";
        const dx = (e && e.clientX != null ? e.clientX : downX) - downX;
        const next = baseX + dx;
        if(next < -revealPx/2){
          closeOtherSwipes(item);
          content.style.transform = `translateX(-${revealPx}px)`;
          item.classList.add("swiped-open");
        } else {
          content.style.transform = "translateX(0)";
          item.classList.remove("swiped-open");
        }
      }
    }

    document.addEventListener("pointermove", onMove, {passive:false});
    document.addEventListener("pointerup", finish);
    document.addEventListener("pointercancel", finish);
  }

  if(swipeHandlers){
    root.querySelectorAll("[data-swipe-star-item]").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const id = btn.dataset.swipeStarItem;
        const task = (await idbGetAll("tasks")).find(t=>t.id===id);
        if(task){
          task.starred = !task.starred;
          await idbPut("tasks", task);
          renderStack();
        }
      });
    });
    root.querySelectorAll("[data-swipe-edit-item], [data-swipe-edit-cat]").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        const id = btn.dataset.swipeEditItem || btn.dataset.swipeEditCat;
        const kind = btn.dataset.swipeEditKind;
        swipeHandlers.onEdit(id, kind);
        closeSwipeRow(btn.closest(".item-row, .cat-row"));
      });
    });
    root.querySelectorAll("[data-swipe-delete-item], [data-swipe-delete-cat]").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        const id = btn.dataset.swipeDeleteItem || btn.dataset.swipeDeleteCat;
        const kind = btn.dataset.swipeDeleteKind;
        swipeHandlers.onDelete(id, kind);
      });
    });
  }
}

async function persistOrder(list, itemSelector, storeKind){
  const els = [...list.querySelectorAll(itemSelector)];
  for(let i=0;i<els.length;i++){
    const el = els[i];
    if(storeKind === "themes"){
      const t = (await idbGetAll("themes")).find(x=>x.id===el.dataset.cat);
      if(t){ t.order = i; await idbPut("themes", t); }
    } else {
      const kind = el.dataset.kind;
      const store = kind === "project" ? "projects" : "tasks";
      const obj = (await idbGetAll(store)).find(x=>x.id===el.dataset.item);
      if(obj){ obj.order = i; await idbPut(store, obj); }
    }
  }
}

/* =========================================================================
   Quick add
   ========================================================================= */
document.getElementById("quickAddSend").addEventListener("click", quickAdd);
document.getElementById("quickAddInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") quickAdd(); });

/* Sur mobile, le clavier virtuel peut recouvrir la barre de saisie rapide (position fixe basée
   sur la fenêtre "de mise en page", qui ne rétrécit pas toujours avec le clavier) — on la
   repositionne dynamiquement juste au-dessus du clavier grâce à visualViewport, pour ne jamais
   taper "à l'aveugle". */
if(window.visualViewport){
  const quickAddEl = document.querySelector(".quick-add");
  function adjustQuickAddForKeyboard(){
    if(!quickAddEl) return;
    const vv = window.visualViewport;
    const keyboardHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    quickAddEl.style.bottom = keyboardHeight > 50 ? `${keyboardHeight + 10}px` : "";
  }
  window.visualViewport.addEventListener("resize", adjustQuickAddForKeyboard);
  window.visualViewport.addEventListener("scroll", adjustQuickAddForKeyboard);
}

async function quickAdd(){
  const input = document.getElementById("quickAddInput");
  const name = input.value.trim();
  if(!name) return;
  const top = state.stack[state.stack.length-1];

  let themeId = "default";
  let projectId = null;

  if(top.screen === "catDetail") themeId = top.themeId;
  if(top.screen === "projectDetail"){
    projectId = top.projectId;
    const project = (await idbGetAll("projects")).find(p=>p.id===projectId);
    themeId = project ? project.themeId : "default";
  }

  await idbPut("tasks", {
    id: uid(), name, projectId, themeId,
    deadline:null, priority:"aucune", status:"active",
    order: Date.now(), starred:false, recurrence:"aucune"
  });
  input.value = "";
  renderStack();
}

/* =========================================================================
   BOOT
   ========================================================================= */
(async function boot(){
  await openDB();
  await seedDefaults();
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  applyTheme(resolveThemeName(settings.appTheme, settings.themeAutoEnabled));
  state.language = settings.language || "fr";
  renderStack();
  if(!settings.hasSeenOnboarding){
    showOnboarding();
  } else {
    // Comparer à la dernière version connue plutôt que de dépendre d'un signal posé juste avant
    // un rechargement automatique (peu fiable dans une PWA iOS) : ainsi, peu importe comment la
    // mise à jour a eu lieu (rechargement auto, relance manuelle, bouton "Mettre à jour"...),
    // on la détecte simplement en comparant à ce qu'on avait vu au démarrage précédent.
    let lastKnownVersion = null;
    try{ lastKnownVersion = localStorage.getItem("beezidayLastVersion"); }catch(e){}
    if(lastKnownVersion && lastKnownVersion !== APP_VERSION){
      openModal(`
        <h3>${tr("appMiseAJourTitre")}</h3>
        <p style="font-size:14px; line-height:1.5; margin-bottom:18px;">${tr("appMiseAJourMsg", APP_VERSION)}</p>
        <div class="modal-actions" style="justify-content:center;">
          <button class="btn-primary" id="justUpdatedClose">${tr("fermer")}</button>
        </div>
      `);
      document.getElementById("justUpdatedClose").addEventListener("click", closeModal);
    }
    try{ localStorage.setItem("beezidayLastVersion", APP_VERSION); }catch(e){}
  }
  await checkWeekRollover();
  await checkAutoSkipHabits();
  checkForNewVersion();
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").then(()=>{
      checkForNewVersion();
    }).catch(err=>{
      console.warn("Service worker non enregistré :", err);
    });
  });
  // Notre service worker appelle déjà skipWaiting()+clients.claim(), donc une nouvelle version
  // finit par prendre le contrôle de l'onglet déjà ouvert — mais sans ce recharger, le
  // JavaScript ancien continuait de tourner en mémoire malgré tout, donnant l'impression que
  // rien ne se passait même après avoir fermé et rouvert l'app.
  let hasReloadedForNewSW = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(hasReloadedForNewSW) return;
    hasReloadedForNewSW = true;
    window.location.reload();
  });
}

/* Sur mobile, rouvrir l'app depuis l'arrière-plan ne recharge pas forcément la page :
   on revérifie donc aussi le changement de semaine, le skip automatique et la disponibilité
   d'une nouvelle version à chaque retour au premier plan. */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    (async ()=>{
      // Si la connexion a été fermée pendant la mise en arrière-plan, on la rouvre avant de
      // relancer quoi que ce soit — pour éviter que l'erreur n'apparaisse ne serait-ce qu'une fois.
      if(!db){ try{ await openDB(); }catch(e){ console.error("Échec de réouverture de la base", e); } }
      checkWeekRollover();
      checkAutoSkipHabits().then(()=>{
        if(state.stack[state.stack.length-1].screen === "habitudes") renderStack();
      });
      checkForNewVersion();
    })();
  }
});
