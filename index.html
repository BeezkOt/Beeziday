/* Avance une date d'un intervalle de récurrence donné */
function daysInMonth(year, month){ // month : 0-indexé
  return new Date(year, month+1, 0).getDate();
}

/* targetDay est le jour du mois "voulu" (ex : 31), conservé tel quel d'occurrence en occurrence
   même quand un mois plus court oblige à le décaler (ex : 30 en avril) — pour qu'un mois de 31
   jours revienne bien sur le 31 plutôt que de dériver définitivement vers 30. */
function addRecurrenceInterval(dateStr, recurrence, targetDay, workDays){
  const d = parseISODate(dateStr);
  switch(recurrence){
    case "quotidienne": d.setDate(d.getDate()+1); return toISODate(d);
    case "joursOuvres": {
      const wd = (workDays && workDays.length) ? workDays : [1,2,3,4,5];
      do{ d.setDate(d.getDate()+1); } while(!wd.includes(d.getDay()));
      return toISODate(d);
    }
    case "hebdomadaire": d.setDate(d.getDate()+7); return toISODate(d);
    case "2semaines": d.setDate(d.getDate()+14); return toISODate(d);
    case "mensuelle": {
      let y = d.getFullYear(), m = d.getMonth()+1;
      if(m > 11){ m = 0; y++; }
      const day = Math.min(targetDay || d.getDate(), daysInMonth(y, m));
      return toISODate(new Date(y, m, day));
    }
    case "annuelle": {
      const y = d.getFullYear()+1, m = d.getMonth();
      const day = Math.min(targetDay || d.getDate(), daysInMonth(y, m));
      return toISODate(new Date(y, m, day));
    }
    default: return dateStr;
  }
}

/* Calcule la prochaine échéance en rattrapant le retard : si la tâche validée était en retard
   de plusieurs jours, on avance d'autant d'intervalles que nécessaire pour ne jamais proposer
   une prochaine occurrence déjà dans le passé (au minimum aujourd'hui). */
function nextRecurrenceDate(oldDeadline, recurrence, targetDay, workDays){
  const todayISO = toISODate(new Date());
  let next = addRecurrenceInterval(oldDeadline, recurrence, targetDay, workDays);
  let guard = 0;
  while(next < todayISO && guard < 1000){
    next = addRecurrenceInterval(next, recurrence, targetDay, workDays);
    guard++;
  }
  return next;
}

/* Bascule une tâche faite/à faire. Si elle vient d'être validée (pas dévalidée) et qu'elle a une
   récurrence + une échéance, crée la prochaine occurrence — jamais avant, tant que celle-ci n'est
   pas cochée, pour ne pas dupliquer une tâche encore en attente. Le lien vers cette occurrence est
   mémorisé sur la tâche d'origine : si on la dévalide, l'occurrence suivante (pas encore traitée)
   est supprimée, pour ne pas se retrouver avec un doublon en revalidant plus tard. */
/* Bascule le statut terminé d'un projet. Décocher est toujours direct (comme une tâche).
   Cocher, si des sous-tâches ne sont pas encore validées, affiche d'abord un avertissement. */
async function toggleProjectDone(projectId){
  const project = (await idbGetAll("projects")).find(p=>p.id===projectId);
  if(!project) return;
  if(project.status === "done"){
    const previousCompletedAt = project.completedAt;
    project.status = "active";
    project.completedAt = null;
    await idbPut("projects", project);
    await removeCompletionLogEntry(projectId, previousCompletedAt);
    renderStack();
    return;
  }
  const subs = await getSubtasks(projectId);
  const allDone = subs.length > 0 && subs.every(t=>t.status==="done");
  if(allDone){
    project.status = "done";
    project.completedAt = toISODate(new Date());
    await idbPut("projects", project);
    await appendCompletionLog({id: projectId, date: project.completedAt, kind:"project", themeId: project.themeId});
    renderStack();
  } else {
    openModal(`
      <h3>${tr("terminerProjet")}</h3>
      <p style="font-size:14px; line-height:1.5; margin-bottom:18px;">${tr("projetTachesIncompletes")}</p>
      <div class="modal-actions" style="flex-direction:column; gap:8px;">
        <button class="btn-primary" id="confirmProjectDoneAnyway" style="width:100%;">${tr("marquerTermineQuandMeme")}</button>
        <button class="btn-ghost" id="cancelProjectDone" style="width:100%;">${tr("annuler")}</button>
      </div>
    `);
    document.getElementById("cancelProjectDone").addEventListener("click", closeModal);
    document.getElementById("confirmProjectDoneAnyway").addEventListener("click", async ()=>{
      project.status = "done";
      project.completedAt = toISODate(new Date());
      await idbPut("projects", project);
      await appendCompletionLog({id: projectId, date: project.completedAt, kind:"project", themeId: project.themeId});
      closeModal();
      renderStack();
    });
  }
}

/* Journal persistant des tâches/projets validés, utilisé pour le rapport hebdomadaire — pour
   qu'il reste exact même si on vide la section "Terminé" (qui, elle, supprime réellement les
   tâches) avant que le rapport de la semaine ne s'affiche. */
async function appendCompletionLog(entry){
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  const log = settings.completionLog || [];
  log.push(entry);
  await idbPut("settings", {key:"completionLog", value: log});
}
async function removeCompletionLogEntry(id, date){
  if(!date) return;
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  const log = settings.completionLog || [];
  const idx = log.findIndex(e=>e.id===id && e.date===date);
  if(idx !== -1){
    log.splice(idx, 1);
    await idbPut("settings", {key:"completionLog", value: log});
  }
}

/* Crée la prochaine occurrence d'une tâche récurrente (mêmes attributs, échéance suivante),
   sans rien changer au statut de la tâche elle-même. Renvoie l'id créé, ou null si la tâche
   n'est pas récurrente / n'a pas d'échéance. Réutilisé à la fois quand on valide une tâche et
   quand on supprime une occurrence qui n'en avait pas encore engendré (sinon la série s'arrêtait
   net dès qu'on supprimait une occurrence pas encore validée). */
async function createNextRecurrence(task){
  if(!task.recurrence || task.recurrence === "aucune" || !task.deadline) return null;
  const targetDay = task.recurrenceDay || parseISODate(task.deadline).getDate();
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  const newId = uid();
  await idbPut("tasks", {
    id: newId,
    name: task.name,
    themeId: task.themeId,
    projectId: task.projectId,
    priority: task.priority,
    starred: false,
    description: task.description,
    recurrence: task.recurrence,
    recurrenceDay: targetDay,
    deadline: nextRecurrenceDate(task.deadline, task.recurrence, targetDay, settings.workDays),
    status: "active",
    order: Date.now(),
    scheduled: task.scheduled || false,
  });
  return newId;
}

async function toggleTaskDone(taskId){
  const task = (await idbGetAll("tasks")).find(t=>t.id===taskId);
  if(!task) return;
  const wasDone = task.status === "done";

  if(wasDone){
    if(task.nextOccurrenceId){
      await idbDelete("tasks", task.nextOccurrenceId);
      task.nextOccurrenceId = null;
    }
    const previousCompletedAt = task.completedAt;
    task.status = "todo";
    task.completedAt = null;
    await idbPut("tasks", task);
    await removeCompletionLogEntry(taskId, previousCompletedAt);
    return;
  }

  task.status = "done";
  task.completedAt = toISODate(new Date());
  await idbPut("tasks", task);
  await appendCompletionLog({id: taskId, date: task.completedAt, kind:"task", themeId: task.themeId, starred: !!task.starred});
  const newId = await createNextRecurrence(task);
  if(newId){
    task.nextOccurrenceId = newId;
    await idbPut("tasks", task);
  }
}

/* Supprime une tâche, avec un avertissement supplémentaire si elle est récurrente (la supprimer
   arrête aussi toute prochaine répétition, puisque celle-ci n'est créée qu'à la validation). */
async function confirmAndDeleteTask(id, afterDelete){
  const task = (await idbGetAll("tasks")).find(t=>t.id===id);
  if(!task) return;
  if(task.recurrence && task.recurrence !== "aucune"){
    openModal(`
      <h3>${tr("supprimer")}</h3>
      <p style="font-size:14px; line-height:1.5; margin-bottom:18px;">${tr("confirmerSuppressionRecurrente")}</p>
      <div class="modal-actions" style="flex-direction:column; gap:8px;">
        <button class="btn-delete" id="delOneOcc" style="width:100%;">${tr("supprimerCetteOccurrence")}</button>
        <button class="btn-delete" id="delAllOcc" style="width:100%;">${tr("supprimerToutesOccurrences")}</button>
        <button class="btn-ghost" id="cancelRecDelete" style="width:100%;">${tr("annuler")}</button>
      </div>
    `);
    document.getElementById("cancelRecDelete").addEventListener("click", closeModal);
    document.getElementById("delOneOcc").addEventListener("click", async ()=>{
      // Si cette occurrence n'a encore jamais été validée, aucune suivante n'a été engendrée —
      // il faut la créer maintenant, sinon supprimer "juste celle-ci" arrêtait toute la série.
      if(!task.nextOccurrenceId){
        await createNextRecurrence(task);
      }
      await idbDelete("tasks", id);
      closeModal();
      if(afterDelete) afterDelete(); else renderStack();
    });
    document.getElementById("delAllOcc").addEventListener("click", async ()=>{
      // Suit la chaîne des occurrences déjà créées (nextOccurrenceId) pour tout supprimer d'un coup.
      const toDelete = [id];
      let cur = task;
      let guard = 0;
      while(cur.nextOccurrenceId && guard < 1000){
        const next = (await idbGetAll("tasks")).find(t=>t.id===cur.nextOccurrenceId);
        if(!next) break;
        toDelete.push(next.id);
        cur = next;
        guard++;
      }
      for(const tid of toDelete) await idbDelete("tasks", tid);
      closeModal();
      if(afterDelete) afterDelete(); else renderStack();
    });
  } else {
    await idbDelete("tasks", id);
    if(afterDelete) afterDelete(); else renderStack();
  }
}

/* Calcule, pour une liste de tâches déjà triée dans l'ordre où elle sera affichée (ordre manuel),
   lesquelles sont verrouillées : une tâche liée est verrouillée tant que la tâche qui la précède
   immédiatement dans cette liste n'est pas validée. Retourne une Map id -> booléen. */
function computeLockStates(orderedTasks){
  const map = new Map();
  for(let i=0;i<orderedTasks.length;i++){
    const t = orderedTasks[i];
    if(!t.linkedToPrevious){ map.set(t.id, false); continue; }
    const pred = i>0 ? orderedTasks[i-1] : null;
    map.set(t.id, !!(pred && pred.status !== "done"));
  }
  return map;
}

/* Supprime un projet. S'il contient des tâches, propose un choix : tout supprimer, ou ne
   supprimer que le projet en détachant ses tâches (qui restent dans la catégorie, sans projet). */
async function confirmAndDeleteProject(id, afterDelete){
  const project = (await idbGetAll("projects")).find(p=>p.id===id);
  if(!project) return;
  const subs = await getSubtasks(id);
  const finish = ()=>{ if(afterDelete) afterDelete(); else renderStack(); };
  if(!subs.length){
    await idbDelete("projects", id);
    finish();
    return;
  }
  openModal(`
    <h3>${tr("supprimer")}</h3>
    <p style="font-size:14px; line-height:1.5; margin-bottom:18px;">${tr("confirmerSuppressionProjet")}</p>
    <div class="modal-actions" style="flex-direction:column; gap:8px;">
      <button class="btn-delete" id="delProjectAndTasks" style="width:100%;">${tr("supprimerProjetEtTaches")}</button>
      <button class="btn-delete" id="delProjectOnly" style="width:100%;">${tr("supprimerProjetSeul")}</button>
      <button class="btn-ghost" id="cancelProjectDelete" style="width:100%;">${tr("annuler")}</button>
    </div>
  `);
  document.getElementById("cancelProjectDelete").addEventListener("click", closeModal);
  document.getElementById("delProjectAndTasks").addEventListener("click", async ()=>{
    for(const s of subs) await idbDelete("tasks", s.id);
    await idbDelete("projects", id);
    closeModal();
    finish();
  });
  document.getElementById("delProjectOnly").addEventListener("click", async ()=>{
    for(const s of subs){ s.projectId = null; await idbPut("tasks", s); }
    await idbDelete("projects", id);
    closeModal();
    finish();
  });
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";

/* Échappe le texte puis transforme les URLs en liens cliquables et les retours à la ligne en <br> */
function linkify(text){
  const esc = escapeHtml(text).replace(/\n/g, "<br>");
  return esc.replace(/(https?:\/\/[^\s<]+)/g, (url)=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

/* Trie les projets/tâches d'une catégorie selon le mode choisi dans l'édition de la catégorie */
function sortItemsByMode(items, mode, linkedContext){
  let sorted;
  if(mode === "echeance"){
    sorted = [...items].sort((a,b)=>{
      const da = a.deadline ? new Date(a.deadline).getTime() : Infinity;
      const db = b.deadline ? new Date(b.deadline).getTime() : Infinity;
      return da - db;
    });
  } else if(mode === "priorite"){
    sorted = [...items].sort((a,b)=> PRIORITY_RANK[b.priority] - PRIORITY_RANK[a.priority]);
  } else if(mode === "etoile"){
    sorted = [...items].sort((a,b)=> (b.starred?1:0) - (a.starred?1:0));
  } else {
    sorted = [...items].sort((a,b)=>(a.order||0)-(b.order||0));
  }
  // Quel que soit le tri choisi, une tâche liée ne doit jamais se retrouver avant sa tâche-mère :
  // on la replace juste après elle une fois le tri fait, plutôt que de dupliquer des attributs
  // (qui pourraient diverger et ne garantiraient rien).
  if(mode !== "manuel" && linkedContext) sorted = enforceLinkedOrder(sorted, linkedContext);
  return sorted;
}

/* Repositionne chaque tâche liée juste après sa tâche-mère "structurelle" (celle qui la précède
   dans l'ordre manuel, indépendamment du tri appliqué à l'affichage). linkedContext est la liste
   complète (tâches faites incluses) triée par ordre manuel, qui sert à identifier qui est la mère
   de qui — le tri lui-même (sortedItems) peut être dans un tout autre ordre. */
function enforceLinkedOrder(sortedItems, linkedContext){
  const parentOf = new Map();
  for(let i=1;i<linkedContext.length;i++){
    if(linkedContext[i].linkedToPrevious) parentOf.set(linkedContext[i].id, linkedContext[i-1].id);
  }
  const result = [...sortedItems];
  for(const [childId, parentId] of parentOf){
    const childIdx = result.findIndex(i=>i.id===childId);
    const parentIdx = result.findIndex(i=>i.id===parentId);
    if(childIdx === -1 || parentIdx === -1 || childIdx === parentIdx+1) continue;
    const [child] = result.splice(childIdx, 1);
    const newParentIdx = result.findIndex(i=>i.id===parentId);
    result.splice(newParentIdx+1, 0, child);
  }
  return result;
}

async function renderCategoryDetail(themeId){
  const theme = (await idbGetAll("themes")).find(t=>t.id===themeId);
  const {projects, tasks} = await getAllActive();
  const todayISO = toISODate(new Date());
  const rawItems = [
    ...projects.filter(p=>p.themeId===themeId).map(p=>({...p, kind:"project"})),
    ...tasks.filter(t=>!t.projectId && t.themeId===themeId).map(t=>({...t, kind:"task"}))
  ];
  const separateUpcoming = theme ? theme.separateUpcoming !== false : true;
  const isUpcomingRecurring = i => separateUpcoming && i.kind==="task" && i.status!=="done" && isFutureRecurringInstance(i);

  // Verrouillage des tâches liées : calculé sur l'ordre manuel de TOUTES les tâches seules
  // (faites incluses, pour connaître le statut du prédécesseur), catégorie par catégorie.
  const standaloneTasksOrdered = rawItems.filter(i=>i.kind==="task").sort((a,b)=>(a.order||0)-(b.order||0));
  const lockMap = computeLockStates(standaloneTasksOrdered);
  rawItems.forEach(i=>{ if(i.kind==="task") i._locked = lockMap.get(i.id) || false; });

  const activeItemsRaw = rawItems.filter(i=> i.status !== "done" && !isUpcomingRecurring(i));
  const activeItems = sortItemsByMode(activeItemsRaw, theme ? (theme.sortMode||"manuel") : "manuel", standaloneTasksOrdered);
  const doneItems = rawItems.filter(i=> i.status === "done").sort((a,b)=>(b.order||0)-(a.order||0));
  const upcomingItems = rawItems.filter(isUpcomingRecurring).sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));

  return `
  <div class="sticky-cat-header">
    <div class="screen-header">
      <button class="back-btn" id="backBtn">${ICONS.back}</button>
      <h1 class="screen-title" style="flex:1">${escapeHtml(theme ? themeDisplayName(theme) : "")}</h1>
      ${theme ? `<button class="icon-btn" id="editCatBtn">${ICONS.pencil}</button>` : ""}
    </div>
    <div class="create-btn-row" id="createBtnRow">
      <button class="create-btn" id="createTaskBtn">${ICONS.plus}<span>${tr("creerUneTacheBtn")}</span></button>
      <button class="create-btn" id="addProjectBtn">${ICONS.plus}<span>${tr("creerUnProjetBtn")}</span></button>
    </div>
  </div>
  <div id="itemList">
    ${activeItems.map(i=>renderItemRow(i, theme?theme.color:null)).join("") || `<div class="placeholder-msg">${tr("rienIci")}</div>`}
  </div>
  ${renderUpcomingRecurringSection(upcomingItems, "cat-"+themeId, theme?theme.color:null)}
  ${renderDoneSection(doneItems, "cat-"+themeId, theme?theme.color:null)}`;

  root.querySelectorAll("[data-subcount]").forEach(async el=>{

async function renderProjectDetail(projectId){
  const project = (await idbGetAll("projects")).find(p=>p.id===projectId);
  const theme = project ? (await idbGetAll("themes")).find(t=>t.id===project.themeId) : null;
  const separateUpcoming = theme ? theme.separateUpcoming !== false : true;
  const subtasks = await getSubtasks(projectId);
  const todayISO = toISODate(new Date());
  const isUpcomingRecurring = t => separateUpcoming && t.status!=="done" && isFutureRecurringInstance(t);
  const lockMap = computeLockStates(subtasks);
  subtasks.forEach(t=>{ t._locked = lockMap.get(t.id) || false; });
  const activeSubs = subtasks.filter(t=>t.status !== "done" && !isUpcomingRecurring(t)).map(t=>({...t, kind:"task"}));
  const doneSubs = subtasks.filter(t=>t.status === "done").map(t=>({...t, kind:"task"}));
  const upcomingSubs = subtasks.filter(isUpcomingRecurring).sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||'')).map(t=>({...t, kind:"task"}));
  return `
  <div class="screen-header">
    <button class="back-btn" id="backBtn">${ICONS.back}</button>

  ${renderUpcomingRecurringSection(upcomingSubs, "proj-"+projectId)}
  ${renderDoneSection(doneSubs, "proj-"+projectId, theme?theme.color:null)}`;
}

const HOUR_ROW_PX = 64;
const DAY_LABELS = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
function dayLabelsShort(){ return dayLabelsFull().map(n=>n.slice(0,3)); }

function renderDayButtons(weekDates, selectedDate, todayISO){
  return weekDates.map(d=>{
    const iso = toISODate(d);
    const cls = ["day-btn"];
    if(iso === selectedDate) cls.push("selected");
    if(iso === todayISO) cls.push("today");
    return `<button class="${cls.join(" ")}" data-date="${iso}">
      <span class="day-btn-label">${dayLabelsShort()[d.getDay()]}</span>
      <span class="day-btn-num">${d.getDate()}</span>
    </button>`;
  }).join("");
}

async function renderDayGrid(selectedDate){
  const [allSlots, themes, settingsRaw] = await Promise.all([idbGetAll("timeslots"), idbGetAll("themes"), idbGetAll("settings")]);
  const settings = Object.fromEntries(settingsRaw.map(s=>[s.key,s.value]));
  const themeMap = Object.fromEntries(themes.map(t=>[t.id, t]));
  const daySlots = allSlots.filter(s=>slotOccursOn(s, selectedDate, settings.workDays));

  let rows = "";
  for(let h=0; h<24; h++){
    rows += `<div class="hour-row" data-hour="${h}" style="top:${h*HOUR_ROW_PX}px;height:${HOUR_ROW_PX}px">
      <span class="hour-label">${String(h).padStart(2,"0")}:00</span>
    </div>`;
  }
  // Ligne de fin purement visuelle à minuit, pour montrer qu'une plage peut aller jusqu'au bout de la journée
  rows += `<div class="hour-row-end" style="top:${24*HOUR_ROW_PX}px"><span class="hour-label">00:00</span></div>`;

  // Ligne indiquant l'heure actuelle, seulement si le jour affiché est aujourd'hui
  if(selectedDate === toISODate(new Date())){
    const now = new Date();
    const nowTop = (now.getHours()*60 + now.getMinutes()) * (HOUR_ROW_PX/60);
    rows += `<div class="now-line" style="top:${nowTop}px"><span class="now-dot"></span></div>`;
  }

  const blocks = daySlots.map(s=>{
    const theme = themeMap[s.themeId];
    const startMin = slotStartMinutes(s.start);
    const durMin = slotEndMinutes(s.end) - startMin;
    const top = startMin * (HOUR_ROW_PX/60);
    const height = Math.max(durMin * (HOUR_ROW_PX/60), 24);
    return `<div class="slot-block" data-slot="${s.id}" data-slot-date="${selectedDate}" data-start-min="${startMin}" data-dur-min="${durMin}" style="top:${top}px;height:${height}px;background:${theme?theme.color:'#8A8F80'}">
      ${s.recurrence && s.recurrence !== "aucune" ? `<span class="slot-repeat-icon">${ICONS.repeat}</span>` : ""}
      <span class="slot-cat">${theme?escapeHtml(themeDisplayName(theme)):"?"}</span>
      ${s.note ? `<span class="slot-note">${escapeHtml(s.note)}</span>` : ""}
      <span class="slot-time">${s.start}–${s.end}</span>
    </div>`;
  }).join("");

  return `<div class="day-grid" style="height:${24*HOUR_ROW_PX + 20}px">${rows}${blocks}</div>`;
}

/* Glisser un bloc de plage verticalement pour la déplacer dans la journée (même mécanique
   "appui bref = tap, appui + mouvement = glisser" que pour les tâches). La durée est conservée ;
   on aimante par pas de 5 minutes et on refuse le dépôt si ça chevaucherait une autre plage
   ce jour-là (l'occurrence déplacée elle-même exclue de la vérification). */
function makeSlotDraggable(root){
  const pxPerMin = HOUR_ROW_PX/60;
  const SNAP_MIN = 5;
  root.querySelectorAll(".slot-block").forEach(block=>{
    let pointerId = null, startY = 0, startTop = 0, holdTimer = null, dragging = false, moved = false;
    const grid = block.closest(".day-grid");
    const durMin = parseFloat(block.dataset.durMin);
    const heightPx = parseFloat(block.style.height);

    block.addEventListener("pointerdown", (e)=>{
      if(pointerId !== null) return;
      pointerId = e.pointerId;
      startY = e.clientY;
      startTop = parseFloat(block.style.top);
      moved = false;
      holdTimer = setTimeout(()=>{
        dragging = true;
        block.classList.add("slot-dragging");
      }, 160);
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });

    function onMove(e){
      if(e.pointerId !== pointerId) return;
      const dy = e.clientY - startY;
      if(Math.abs(dy) > 6 && !dragging) moved = true;
      if(!dragging) return;
      e.preventDefault();
      let newTop = startTop + dy;
      newTop = Math.max(0, Math.min(24*HOUR_ROW_PX - heightPx, newTop));
      block.style.top = newTop + "px";
    }

    async function onUp(e){
      if(e.pointerId !== pointerId) return;
      clearTimeout(holdTimer);
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      pointerId = null;

      if(!dragging){
        if(!moved){
          const slot = (await idbGetAll("timeslots")).find(s=>s.id===block.dataset.slot);
          if(slot) openSlotModal(slot, null, null, block.dataset.slotDate);
        }
        return;
      }
      dragging = false;
      block.classList.remove("slot-dragging");
      lastGestureEndTime = performance.now();

      try{
        const rawStartMin = parseFloat(block.style.top) / pxPerMin;
        let newStartMin = Math.round(rawStartMin / SNAP_MIN) * SNAP_MIN;
        newStartMin = Math.max(0, Math.min(24*60 - durMin, newStartMin));
        let newEndMin = newStartMin + durMin;

        const selectedDate = block.dataset.slotDate;
        const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
        const allSlots = await idbGetAll("timeslots");
        const daySlots = allSlots.filter(s=>s.id !== block.dataset.slot && slotOccursOn(s, selectedDate, settings.workDays));
        const findOverlap = (s0, e0)=> daySlots.find(s=>{
          const sStart = slotStartMinutes(s.start), sEnd = slotEndMinutes(s.end);
          return s0 < sEnd && e0 > sStart;
        });

        let hit = findOverlap(newStartMin, newEndMin);
        if(hit){
          // Se cale juste après la plage percutée (au prochain créneau libre), plutôt que
          // d'annuler directement le déplacement.
          const snappedStart = slotEndMinutes(hit.end);
          const snappedEnd = snappedStart + durMin;
          if(snappedEnd <= 24*60 && !findOverlap(snappedStart, snappedEnd)){
            newStartMin = snappedStart;
            newEndMin = snappedEnd;
            hit = null;
          }
        }

        if(hit){
          // Toujours en conflit (ou plus de place après) : on annule et on remet à l'origine.
          block.style.top = startTop + "px";
          return;
        }

        const slot = allSlots.find(s=>s.id===block.dataset.slot);
        if(slot){
          slot.start = minutesToTime(newStartMin);
          slot.end = minutesToTime(newEndMin);
          await idbPut("timeslots", slot);
        }
        renderStack();
      }catch(err){
        // Filet de sécurité : si quoi que ce soit échoue ici, on ne laisse jamais le bloc
        // affiché à une position "en l'air" qui ne correspond à rien d'enregistré.
        console.error("Erreur pendant le déplacement de la plage", err);
        block.style.top = startTop + "px";
      }
    }
  });
}

async function renderPlages(){
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  const weekStartDay = settings.weekStart ?? 1;
  const todayISO = toISODate(new Date());
  if(!state.plagesSelectedDate) state.plagesSelectedDate = todayISO;

  const weekDates = getWeekDates(state.plagesWeekOffset, weekStartDay);
  const weekISOs = weekDates.map(toISODate);
  const allSlots = await idbGetAll("timeslots");
  const weekHasSlots = weekISOs.some(iso => allSlots.some(s=>slotOccursOn(s, iso, settings.workDays)));
  const prevWeekISOs = getWeekDates(state.plagesWeekOffset-1, weekStartDay).map(toISODate);
  const prevWeekHasSlots = prevWeekISOs.some(iso => allSlots.some(s=>slotOccursOn(s, iso, settings.workDays)));

  let html = `
  <div class="sticky-cat-header">
    <div class="screen-header">
      <h1 class="screen-title" style="flex:1">${tr("plagesDeTemps")}</h1>
      <button class="icon-btn" id="addSlotBtn">${ICONS.plus}</button>
    </div>
    <div class="week-nav">
      <button class="week-arrow" id="weekPrev" aria-label="Semaine précédente">${ICONS.back}</button>
      <div class="week-label">${formatWeekLabel(weekDates[0], weekDates[6])}</div>
      <button class="week-arrow" id="weekNext" aria-label="Semaine suivante">${ICONS.chevRight}</button>
    </div>
    <div class="day-btn-row">${renderDayButtons(weekDates, state.plagesSelectedDate, todayISO)}</div>
  </div>`;

  if(!weekHasSlots && prevWeekHasSlots){
    html += `
    <div class="copy-week-banner">
      <span>${tr("reprendreSemaine")}</span>
      <button class="btn-choose" id="copyWeekBtn">${tr("copier")}</button>
    </div>`;
  }

  html += `<div class="day-grid-wrap">${await renderDayGrid(state.plagesSelectedDate)}</div>`;
  return html;
}

function shiftSelectedDate(deltaDays){
  const d = parseISODate(state.plagesSelectedDate);
  d.setDate(d.getDate() + deltaDays);
  state.plagesSelectedDate = toISODate(d);
}

async function copyPreviousWeekSlots(){
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  const weekStartDay = settings.weekStart ?? 1;
  const curWeek = getWeekDates(state.plagesWeekOffset, weekStartDay).map(toISODate);
  const prevWeek = getWeekDates(state.plagesWeekOffset-1, weekStartDay).map(toISODate);
  const allSlots = await idbGetAll("timeslots");
  for(let i=0;i<7;i++){
    const daySlots = allSlots.filter(s=>slotOccursOn(s, prevWeek[i], settings.workDays));
    for(const s of daySlots){
      await idbPut("timeslots", {id:uid(), date:curWeek[i], start:s.start, end:s.end, themeId:s.themeId, note:s.note||""});
    }
  }
}

async function openSlotModal(existing, date, hour, occurrenceDate){
  const themes = (await idbGetAll("themes")).filter(t=>(t.forProjects || t.forSlots) && !t.isDefault).sort((a,b)=>(a.order||0)-(b.order||0));
  const defaultStart = existing ? existing.start : (hour != null ? `${String(hour).padStart(2,"0")}:00` : "09:00");
  const defaultEnd = existing ? existing.end : (hour != null ? (hour===23 ? "00:00" : `${String(hour+1).padStart(2,"0")}:00`) : "10:00");
  slotModalContext = {existing, date: existing ? (occurrenceDate || existing.date) : date, occurrenceDate: occurrenceDate || null};

  openModal(slotFormHtml(existing, defaultStart, defaultEnd, themes));
  const themeSelect = document.getElementById("mSlotTheme");
  themeSelect.value = existing ? existing.themeId : (themes[0] ? themes[0].id : "");
  document.getElementById("mSlotRecurrence").value = existing ? (existing.recurrence || "aucune") : "aucune";

  document.getElementById("mSlotCancel").addEventListener("click", closeModal);
  document.getElementById("mSlotSave").addEventListener("click", saveSlotModal);
  modalOutsideClickHandler = saveSlotModal;
  document.getElementById("slotAddCatBtn").addEventListener("click", ()=>{
    document.getElementById("slotNewCatForm").innerHTML = slotNewCatFormHtml();
    attachSlotNewCatEvents();
  });
  const delBtn = document.getElementById("mSlotDelete");
  if(delBtn){
    if(existing && existing.recurrence && existing.recurrence !== "aucune"){
      delBtn.addEventListener("click", ()=>{
        openModal(`
          <h3>${tr("supprimer")}</h3>
          <p style="font-size:14px; line-height:1.5; margin-bottom:18px;">${tr("confirmerSuppressionPlageRecurrente")}</p>
          <div class="modal-actions" style="flex-direction:column; gap:8px;">
            <button class="btn-delete" id="delOneSlotOcc" style="width:100%;">${tr("supprimerCetteOccurrence")}</button>
            <button class="btn-delete" id="delAllSlotOcc" style="width:100%;">${tr("supprimerToutePlageSerie")}</button>
            <button class="btn-ghost" id="cancelSlotRecDelete" style="width:100%;">${tr("annuler")}</button>
          </div>
        `);
        document.getElementById("cancelSlotRecDelete").addEventListener("click", closeModal);
        document.getElementById("delOneSlotOcc").addEventListener("click", async ()=>{
          const occDate = slotModalContext.occurrenceDate || existing.date;
          const exceptions = [...(existing.exceptions || []), occDate];
          await idbPut("timeslots", {...existing, exceptions});
          state.currentSlotThemeOverride = null;
          state.currentItemOverride = null;
          closeModal();
          renderStack();
        });
        document.getElementById("delAllSlotOcc").addEventListener("click", async ()=>{
          await idbDelete("timeslots", existing.id);
          state.currentSlotThemeOverride = null;
          state.currentItemOverride = null;
          closeModal();
          renderStack();
        });
      });
    } else {
      attachTwoStepDelete(delBtn, async ()=>{
        await idbDelete("timeslots", existing.id);
        state.currentSlotThemeOverride = null;
        state.currentItemOverride = null;
        closeModal();
        renderStack();
      });
    }
  }
}

function showSlotError(msg){
  const el = document.getElementById("slotError");
  el.textContent = msg;
  el.classList.add("show");
}

async function saveSlotModal(){
  const start = document.getElementById("mSlotStart").value;
  const end = document.getElementById("mSlotEnd").value;
  const themeId = document.getElementById("mSlotTheme").value;
  const note = document.getElementById("mSlotNote").value.trim();
  if(!start || !end || !themeId) return;

  const startM = slotStartMinutes(start);
  const endM = slotEndMinutes(end);
  if(endM <= startM){
    showSlotError("L'heure de fin doit être après l'heure de début.");
    return;
  }

  const {existing, date} = slotModalContext;
  const allSlots = await idbGetAll("timeslots");
  // Les autres plages du même jour (on exclut la plage en cours d'édition)
  const daySlots = allSlots.filter(s => s.date === date && (!existing || s.id !== existing.id));

  // Chevauchement strict : se toucher pile (fin = début) est autorisé, se recouvrir ne l'est pas.
  const conflict = daySlots.find(s => startM < slotEndMinutes(s.end) && endM > slotStartMinutes(s.start));

  if(conflict){
    const conflictEndM = slotEndMinutes(conflict.end);
    // Si repousser le début de la nouvelle plage à la fin de celle qui bloque suffit à régler le problème, on le fait
    if(conflictEndM < endM){
      const stillConflict = daySlots.some(s => s !== conflict && conflictEndM < slotEndMinutes(s.end) && endM > slotStartMinutes(s.start));
      if(!stillConflict){
        document.getElementById("mSlotStart").value = conflict.end;
        showSlotError(`Cette plage chevauchait ${conflict.start}–${conflict.end} : le début a été ajusté à ${conflict.end}. Vérifie et enregistre à nouveau.`);
        return;
      }
    }
    showSlotError(`Cette plage chevauche une plage existante (${conflict.start}–${conflict.end}).`);
    return;
  }

  const obj = existing ? {...existing} : {id: uid(), date};
  obj.start = start; obj.end = end; obj.themeId = themeId; obj.note = note;
  obj.recurrence = document.getElementById("mSlotRecurrence").value;
  await idbPut("timeslots", obj);
  // Une plage vient d'être modifiée : on efface les bascules manuelles du Dashboard pour qu'il
  // retrouve la vraie plage/catégorie actuelle au lieu de rester bloqué sur un ancien choix.
  state.currentSlotThemeOverride = null;
  state.currentItemOverride = null;
  closeModal();
  renderStack();
}

/* =========================================================================
   RENDER — Habitudes
   ========================================================================= */
const DAY_LETTER = ["D","L","M","M","J","V","S"]; // dim, lun, mar, mer, jeu, ven, sam

function currentMomentOfDay(){
  const h = new Date().getHours();
  if(h < 12) return "matin";
  if(h < 18) return "apres-midi";
  return "soir";
}

function computeDailyStreak(habit, todayISO){
  const completions = habit.completions || {};
  let streak = 0;
  let cursor = parseISODate(todayISO);
  if(!completions[todayISO]) cursor.setDate(cursor.getDate()-1);
  while(completions[toISODate(cursor)]){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeWeeklyStreak(habit, weekStartDay){
  const completions = habit.completions || {};
  const n = habit.timesPerWeek || 1;
  function weekCount(offset){
    return getWeekDates(offset, weekStartDay).map(toISODate).filter(d=>completions[d]).length;
  }
  let streak = 0, offset = 0;
  if(weekCount(0) < n) offset = -1;
  while(weekCount(offset) >= n){ streak++; offset--; }
  return streak;
}

/* Score hebdo sur 3 : (accompli / attendu) × 3, arrondi. "Attendu" ne compte que les jours
   déjà écoulés de la semaine pour les habitudes quotidiennes, pour ne pas pénaliser trop tôt. */
async function computeWeekScoreForDates(weekDatesISOs){
  const habits = await idbGetAll("habits");
  const todayISO = toISODate(new Date());
  let expected = 0, done = 0;
  for(const h of habits){
    const completions = h.completions || {};
    if(h.frequency === "hebdomadaire"){
      const n = h.timesPerWeek || 1;
      expected += n;
      done += Math.min(weekDatesISOs.filter(d=>completions[d]).length, n);
    } else {
      const relevantDays = weekDatesISOs.filter(d => d <= todayISO);
      expected += relevantDays.length;
      done += relevantDays.filter(d => completions[d]).length;
    }
  }
  if(expected === 0) return 0;
  return Math.max(0, Math.min(3, Math.round((done/expected)*3)));
}

/* Dégradé du connecteur : plus la série de jours validés est longue, plus il tire vers un vert
   pomme "peps" ; une série courte reste dans un vert forêt clair plus discret. */
function habitConnectorGradient(){
  const theme = document.body.className.replace("theme-", "") || "light";
  // Dégradé complet (vert clair → jaune, en passant naturellement par du vert pomme via
  // l'interpolation RGB) sur toute la largeur de chaque barre, adapté par thème :
  // - clair : vert forêt clair vers jaune "étoile"
  // - sombre : plus mat/désaturé pour ne pas vibrer contre le vert des ronds
  // - crème : plus clair qu'avant, kaki vers jaune
  const PAIRS = {
    light: [[152,205,178],[242,194,48]],
    dark:  [[176,176,168],[224,138,64]],
    cream: [[205,200,155],[232,196,110]],
  };
  const [start, end] = PAIRS[theme] || PAIRS.light;
  return `linear-gradient(90deg, rgb(${start.join(',')}), rgb(${end.join(',')}))`;
}

/* Pose, derrière les ronds (pas seulement entre eux), une barre continue pour chaque série de
   jours validés consécutifs. Recalculé après chaque rendu car la largeur des ronds est flexible
   (ils remplissent toute la largeur de la boîte, leur taille dépend donc du nombre de jours). */
function layoutHabitConnectors(root){
  root.querySelectorAll(".habit-days-row").forEach(row=>{
    row.querySelectorAll(".day-connector").forEach(el=>el.remove());
    const circles = [...row.querySelectorAll(".day-circle")];
    if(circles.length < 2) return;
    const filled = circles.map(c=>c.classList.contains("done") || c.classList.contains("skipped"));
    // Encouragement : si aujourd'hui n'est pas encore validé mais que la veille l'est,
    // on prolonge visuellement le trait jusqu'à aujourd'hui (sans changer l'état réel du rond).
    // Dès que le lendemain arrive, "today" se déplace et cette extension ne s'applique plus ici.
    const visual = [...filled];
    circles.forEach((c,i)=>{
      if(c.classList.contains("today") && !filled[i] && i>0 && filled[i-1]) visual[i] = true;
    });
    const rowRect = row.getBoundingClientRect();
    let i = 0;
    while(i < circles.length){
      if(!visual[i]){ i++; continue; }
      let j = i;
      while(j+1 < circles.length && visual[j+1]) j++;
      if(j > i){
        const r1 = circles[i].getBoundingClientRect();
        const r2 = circles[j].getBoundingClientRect();
        const bar = document.createElement("div");
        bar.className = "day-connector";
        // Bord gauche du premier rond jusqu'au bord droit du dernier, pour un trait continu
        // qui passe derrière les ronds plutôt que de s'arrêter entre eux.
        const left = r1.left - rowRect.left;
        const right = (r2.left + r2.width) - rowRect.left;
        bar.style.left = left + "px";
        bar.style.width = Math.max(right - left, 0) + "px";
        bar.style.height = r1.height + "px";
        bar.style.top = (r1.top - rowRect.top) + "px";
        bar.style.background = habitConnectorGradient();
        row.insertBefore(bar, row.firstChild);
      }
      i = j + 1;
    }
  });
}

/* Une habitude est "faite maintenant" si aujourd'hui est rempli (quotidienne) ou si l'objectif
   de la semaine est atteint (hebdomadaire) — un jour "skip" compte comme fait. */
function isHabitDoneNow(h, todayISO, weekDatesISOs){
  const completions = h.completions || {};
  if(h.frequency === "hebdomadaire"){
    const n = h.timesPerWeek || 1;
    return weekDatesISOs.filter(d=>completions[d]).length >= n;
  }
  return !!completions[todayISO];
}

function renderHabitCard(h, todayISO, weekDatesISOs, weekStartDay, allowSkip){
  const completions = h.completions || {};
  const checkedToday = !!completions[todayISO];
  const doneNow = isHabitDoneNow(h, todayISO, weekDatesISOs);
  let circlesHtml, streak;

  if(h.frequency === "hebdomadaire"){
    const n = h.timesPerWeek || 1;
    const count = weekDatesISOs.filter(d=>completions[d]).length;
    circlesHtml = Array.from({length:n}).map((_,i)=>{
      const idx = i+1;
      const isFilled = idx <= count;
      const isSkip = isFilled && completions[weekDatesISOs[idx-1]] === "skip";
      const cls = ["day-circle"];
      if(isFilled) cls.push(isSkip ? "skipped" : "done");
      return `<div class="${cls.join(' ')}"><span>${idx}</span></div>`;
    }).join("");
    streak = computeWeeklyStreak(h, weekStartDay);
  } else {
    circlesHtml = weekDatesISOs.map((iso,i)=>{
      const d = parseISODate(iso);
      const val = completions[iso];
      const isFilled = !!val;
      const isToday = iso === todayISO;
      const cls = ["day-circle"];
      if(isFilled) cls.push(val === "skip" ? "skipped" : "done");
      if(isToday) cls.push("today");
      return `<div class="${cls.join(' ')}"><span>${DAY_LETTER[d.getDay()]}</span></div>`;
    }).join("");
    streak = computeDailyStreak(h, todayISO);
  }

  const descKey = {faible:"descFaible", normale:"descNormale", elevee:"descElevee"}[state.habitsEnergyLevel] || "descNormale";
  const desc = h[descKey] || "";

  return `
  <div class="habit-card ${doneNow?'done':''}" data-habit="${h.id}">
    <div class="swipe-actions">
      <button class="swipe-btn swipe-edit" data-swipe-edit-habit="${h.id}" aria-label="Modifier">${ICONS.pencil}</button>
      <button class="swipe-btn swipe-delete" data-swipe-delete-habit="${h.id}" aria-label="Supprimer">${ICONS.trash}</button>
    </div>
    <div class="swipe-content">
      <div class="habit-top">
        <div class="check-circle ${checkedToday?'done':''}" data-checkhabit="${h.id}">${ICONS.check}</div>
        <div class="habit-title">${escapeHtml(h.name)}</div>
        <div class="habit-streak-badge">${ICONS.flame}${streak}</div>
      </div>
      ${desc ? `<p class="habit-desc">${escapeHtml(desc)}</p>` : ""}
      <div class="habit-days-row">${circlesHtml}</div>
    </div>
  </div>`;
}

async function renderHabitudes(){
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  const weekStartDay = settings.weekStart ?? 1;
  const allowSkip = !!settings.allowHabitSkip;
  const habits = await idbGetAll("habits");
  const todayISO = toISODate(new Date());
  const weekDatesISOs = getWeekDates(0, weekStartDay).map(toISODate);

  if(!state.habitsMomentFilter) state.habitsMomentFilter = currentMomentOfDay();
  if(!state.habitsEnergyLevel) state.habitsEnergyLevel = "normale";

  const score = await computeWeekScoreForDates(weekDatesISOs);

  const filtered = habits.filter(h=>{
    if(state.habitsMomentFilter === "toutes") return true;
    if(h.frequency === "hebdomadaire") return true;
    if(h.momentDuJour === "toute-journee") return true;
    return h.momentDuJour === state.habitsMomentFilter;
  }).sort((a,b)=>{
    // Les habitudes déjà faites passent en dessous des non-faites
    const da = isHabitDoneNow(a, todayISO, weekDatesISOs) ? 1 : 0;
    const db = isHabitDoneNow(b, todayISO, weekDatesISOs) ? 1 : 0;
    if(da !== db) return da - db;
    return (a.order||0) - (b.order||0);
  });

  const rows = filtered.map(h=>renderHabitCard(h, todayISO, weekDatesISOs, weekStartDay, allowSkip)).join("")
    || `<div class="placeholder-msg">${tr("aucuneHabitude")}</div>`;

  return `
  <div class="screen-header">
    <h1 class="screen-title" style="flex:1">${tr("habitudes")}</h1>
    <button class="icon-btn" id="addHabitBtn">${ICONS.plus}</button>
  </div>
  <div class="habit-score-row">
    <span class="habit-score-label">${tr("score")}</span>
    <div class="habit-medals">
      ${[1,2,3].map(n=>`<span class="score-star ${n<=score?'filled':''}">${ICONS.star}</span>`).join("")}
    </div>
  </div>
  <div class="habit-filters-row">
    <select id="momentFilter">
      <option value="matin" ${state.habitsMomentFilter==='matin'?'selected':''}>${tr("matin")}</option>
      <option value="apres-midi" ${state.habitsMomentFilter==='apres-midi'?'selected':''}>${tr("apresMidi")}</option>
      <option value="soir" ${state.habitsMomentFilter==='soir'?'selected':''}>${tr("soir")}</option>
      <option value="toutes" ${state.habitsMomentFilter==='toutes'?'selected':''}>${tr("toutesLesHabitudes")}</option>
    </select>
    <select id="energyFilter">
      <option value="faible" ${state.habitsEnergyLevel==='faible'?'selected':''}>${tr("energieFaible")}</option>
      <option value="normale" ${state.habitsEnergyLevel==='normale'?'selected':''}>${tr("energieNormale")}</option>
      <option value="elevee" ${state.habitsEnergyLevel==='elevee'?'selected':''}>${tr("energieElevee")}</option>
    </select>
  </div>
  <div id="habitsList">${rows}</div>`;
}

async function openHabitModal(existing){
  habitModalContext = {existing};
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  const weekDatesISOs = getWeekDates(0, settings.weekStart ?? 1).map(toISODate);
  openModal(habitFormHtml(existing, weekDatesISOs));

  const freqSelect = document.getElementById("hFrequency");
  const timesWrap = document.getElementById("hTimesWrap");
  freqSelect.value = existing ? existing.frequency : "quotidienne";
  document.getElementById("hTimesPerWeek").value = existing ? (existing.timesPerWeek || 3) : 3;
  document.getElementById("hMoment").value = existing ? existing.momentDuJour : "toute-journee";
  timesWrap.style.display = freqSelect.value === "hebdomadaire" ? "block" : "none";
  freqSelect.addEventListener("change", ()=>{
    timesWrap.style.display = freqSelect.value === "hebdomadaire" ? "block" : "none";
  });

  if(existing){
    document.querySelectorAll("#habitEditDays [data-toggle-day]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const iso = btn.dataset.toggleDay;
        const habit = (await idbGetAll("habits")).find(h=>h.id===existing.id);
        if(!habit) return;
        habit.completions = habit.completions || {};
        // "skip-done" mémorise durablement qu'un jour skip a été validé manuellement : dévalider
        // y ramène ensuite (même après avoir fermé et rouvert cette modale plusieurs fois),
        // contrairement à une simple case vide qui, elle, oublierait cette origine.
        const cur = habit.completions[iso];
        if(cur === "skip") habit.completions[iso] = "skip-done";
        else if(cur === "skip-done") habit.completions[iso] = "skip";
        else if(cur === true) delete habit.completions[iso];
        else habit.completions[iso] = true;
        await idbPut("habits", habit);
        await checkAutoSkipHabits();
        const freshHabit = (await idbGetAll("habits")).find(h=>h.id===existing.id);
        existing.completions = freshHabit ? freshHabit.completions : habit.completions;
        document.querySelectorAll("#habitEditDays [data-toggle-day]").forEach(dayBtn=>{
          const dayIso = dayBtn.dataset.toggleDay;
          const val = existing.completions && existing.completions[dayIso];
          dayBtn.classList.remove("done","skipped");
          if(val === true || val === "skip-done") dayBtn.classList.add("done");
          else if(val === "skip") dayBtn.classList.add("skipped");
        });
      });
    });
  }

  document.getElementById("hCancel").addEventListener("click", closeModal);
  document.getElementById("hSave").addEventListener("click", saveHabitModal);
  modalOutsideClickHandler = saveHabitModal;
  const delBtn = document.getElementById("hDelete");
  if(delBtn){
    attachTwoStepDelete(delBtn, async ()=>{
      await idbDelete("habits", existing.id);
      closeModal();
      renderStack();
    });
  }
}

async function saveHabitModal(){
  const name = document.getElementById("hName").value.trim();
  if(!name) return;
  const frequency = document.getElementById("hFrequency").value;
  const timesPerWeek = parseInt(document.getElementById("hTimesPerWeek").value, 10);
  const momentDuJour = document.getElementById("hMoment").value;
  const descFaible = document.getElementById("hDescFaible").value.trim();
  const descNormale = document.getElementById("hDescNormale").value.trim();
  const descElevee = document.getElementById("hDescElevee").value.trim();

  const {existing} = habitModalContext;
  const obj = existing ? {...existing} : {id: uid(), completions:{}, order: Date.now()};
  if(existing){
    // Relit les complétions les plus récentes en base : la grille "jours de cette semaine" écrit
    // directement en base à chaque clic, et sans ça, sauvegarder ici pouvait écraser ce changement
    // avec une copie périmée si les deux se chevauchaient dans le temps.
    const freshHabit = (await idbGetAll("habits")).find(h=>h.id===existing.id);
    if(freshHabit) obj.completions = freshHabit.completions;
  }
  obj.name = name; obj.frequency = frequency; obj.timesPerWeek = timesPerWeek;
  obj.momentDuJour = momentDuJour; obj.descFaible = descFaible; obj.descNormale = descNormale; obj.descElevee = descElevee;
  await idbPut("habits", obj);
  await checkAutoSkipHabits();
  closeModal();
  renderStack();
}

/* ---- Pop-up de récap hebdomadaire (nouvelle semaine) ---- */
function weekRecapMessage(score){
  if(score >= 3) return {tier:"gold", title:tr("semaineOr"), msg:tr("msgOr")};
  if(score === 2) return {tier:"silver", title:tr("semaineArgent"), msg:tr("msgArgent")};
  if(score === 1) return {tier:"bronze", title:tr("semaineBronze"), msg:tr("msgBronze")};
  return {tier:"", title:tr("nouvelleSemaine"), msg:tr("msgNeutre")};
}

async function showWeekRecapFullscreen(prevWeekDates){
  const score = await computeWeekScoreForDates(prevWeekDates);
  const {tier, title, msg} = weekRecapMessage(score);

  const [settingsRaw, themes] = await Promise.all([idbGetAll("settings"), idbGetAll("themes")]);
  const settings = Object.fromEntries(settingsRaw.map(s=>[s.key,s.value]));
  const log = settings.completionLog || [];
  const weekEntries = log.filter(e=>prevWeekDates.includes(e.date));
  const doneTasks = weekEntries.filter(e=>e.kind==="task");
  const doneProjects = weekEntries.filter(e=>e.kind==="project");
  const starredDone = doneTasks.filter(e=>e.starred).length;

  const byTheme = {};
  doneTasks.forEach(e=>{ byTheme[e.themeId] = (byTheme[e.themeId]||0) + 1; });
  const themeMap = Object.fromEntries(themes.map(t=>[t.id, t]));
  const catRows = Object.entries(byTheme)
    .map(([themeId, count])=>({theme: themeMap[themeId], count}))
    .filter(r=>r.theme)
    .sort((a,b)=>b.count - a.count);

  state.weekRecapData = {tier, title, msg, score, doneCount: doneTasks.length, projectsDoneCount: doneProjects.length, starredDone, catRows};
  state.weekRecapIndex = 0;
  renderWeekRecap();
  document.getElementById("weekRecapOverlay").style.display = "flex";
}

  if(i === 0){

/* Si l'option est activée dans les réglages, marque automatiquement UN jour manqué (dans le
   passé de la semaine en cours, jamais aujourd'hui) comme "skip" — au plus une fois par semaine
   et par habitude. Se vérifie une fois par jour. Reste éditable ensuite : dans la modale d'édition,
   cliquer sur ce jour le valide et libère à nouveau le skip pour le reste de la semaine. */
async function checkAutoSkipHabits(){
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  if(!settings.allowHabitSkip) return;
  const todayISO = toISODate(new Date());

  const weekStartDay = settings.weekStart ?? 1;
  const weekDatesISOs = getWeekDates(0, weekStartDay).map(toISODate);
  const habits = await idbGetAll("habits");

  for(const h of habits){
    if(h.frequency !== "quotidienne") continue;
    h.completions = h.completions || {};
    const alreadyUsedThisWeek = weekDatesISOs.some(d => h.completions[d] === "skip");
    if(alreadyUsedThisWeek) continue;
    for(const iso of weekDatesISOs){
      if(iso >= todayISO) break; // jamais aujourd'hui ni le futur
      if(!h.completions[iso]){
        h.completions[iso] = "skip";
        await idbPut("habits", h);
        break; // un seul jour auto-skip par semaine
      }
    }
  }
}

async function checkWeekRollover(){
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  const weekStartDay = settings.weekStart ?? 1;
  const curWeekStartISO = toISODate(startOfWeekContaining(new Date(), weekStartDay));
  const last = settings.lastSeenWeekStart;
  if(last && last !== curWeekStartISO){
    const prevWeekDates = [];
    let d = parseISODate(last);
    for(let i=0;i<7;i++){ prevWeekDates.push(toISODate(d)); d.setDate(d.getDate()+1); }
    showWeekRecapFullscreen(prevWeekDates);
  }
  await idbPut("settings", {key:"lastSeenWeekStart", value: curWeekStartISO});

  // Élague le journal de complétion : on ne garde que les 60 derniers jours, largement assez
  // pour les rapports hebdomadaires, pour ne pas le laisser grossir indéfiniment.
  const log = settings.completionLog || [];
  if(log.length){
    const cutoff = toISODate(new Date(Date.now() - 60*86400000));
    const pruned = log.filter(e=>e.date >= cutoff);
    if(pruned.length !== log.length) await idbPut("settings", {key:"completionLog", value: pruned});
  }
}

/* Vérifie si une nouvelle version a été publiée, via un petit fichier version.json qu'il faut
   mettre à jour (en même temps que APP_VERSION ici et CACHE_NAME dans service-worker.js) à
   chaque déploiement. cache:"no-store" garantit qu'on ne lit jamais une copie mise en cache. */
let updateNoticeShownFor = null;
async function checkForNewVersion(){
  try{
    if("serviceWorker" in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) reg.update();
    }
    const res = await fetch("version.json", {cache:"no-store"});
    if(!res.ok) return;
    const data = await res.json();
    if(data.version && data.version !== APP_VERSION && updateNoticeShownFor !== data.version){
      updateNoticeShownFor = data.version;
      openModal(`
        <h3>${tr("updateAvailableTitle")}</h3>
        <p style="font-size:14px; line-height:1.5; margin-bottom:18px;">${tr("updateAvailableMsg")}</p>
        <div class="modal-actions" style="justify-content:center;">
          <button class="btn-primary" id="updateNoticeClose">${tr("fermer")}</button>
        </div>
      `);
      document.getElementById("updateNoticeClose").addEventListener("click", closeModal);
    }
  }catch(err){
    // pas de connexion, ou version.json absent : on n'embête pas la personne pour ça
  }
}

/* Vérification manuelle déclenchée depuis les Réglages : contrairement à checkForNewVersion,
   celle-ci affiche toujours un résultat clair (à jour, ou nouvelle version + bouton pour l'appliquer),
   plutôt que de rester silencieuse quand tout va bien ou en cas d'erreur. */
async function checkForUpdateManual(){
  try{
    if("serviceWorker" in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) await reg.update();
    }
    const res = await fetch("version.json", {cache:"no-store"});
    if(!res.ok) throw new Error("version.json indisponible");
    const data = await res.json();
    if(data.version && data.version !== APP_VERSION){
      openModal(`
        <h3>${tr("nouvelleVersionTitre")}</h3>
        <p style="font-size:14px; line-height:1.5; margin-bottom:18px;">${tr("nouvelleVersionMsg", data.version)}</p>
        <div class="modal-actions" style="justify-content:center; flex-direction:column; gap:8px;">
          <button class="btn-primary" id="updateNowBtn" style="width:100%;">${tr("mettreAJourMaintenant")}</button>
          <button class="btn-ghost" id="updateLaterBtn" style="width:100%;">${tr("fermer")}</button>
        </div>
      `);
      document.getElementById("updateLaterBtn").addEventListener("click", closeModal);
      document.getElementById("updateNowBtn").addEventListener("click", ()=>{
        window.location.reload();
      });
    } else {
      openModal(`
        <h3>${tr("appAJourTitre")}</h3>
        <p style="font-size:14px; line-height:1.5; margin-bottom:18px;">${tr("appAJourMsg")}</p>
        <div class="modal-actions" style="justify-content:center;">
          <button class="btn-primary" id="upToDateClose">${tr("fermer")}</button>
        </div>
      `);
      document.getElementById("upToDateClose").addEventListener("click", closeModal);
    }
  }catch(err){
    openModal(`
      <h3>${tr("verificationImpossible")}</h3>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn-primary" id="checkErrClose">${tr("fermer")}</button>
      </div>
    `);
    document.getElementById("checkErrClose").addEventListener("click", closeModal);
  }
}

/* Calcule le thème effectif à partir du choix du menu déroulant et du bouton "mode automatique" :
   si le mode auto est activé, le sombre du système prend le dessus ; sinon on garde le choix du
   menu (et "Sombre" retombe sur "Clair" quand le système n'est pas en mode sombre, puisque
   "Sombre" n'a pas de pendant clair naturel). */
function resolveThemeName(appTheme, autoEnabled){
  const base = appTheme || "light";
  if(!autoEnabled) return base;
  const systemDark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  if(systemDark) return "dark";
  return base === "dark" ? "light" : base;
}

async function applyThemeFromSettings(){
  const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
  applyTheme(resolveThemeName(settings.appTheme, settings.themeAutoEnabled));
}

/* En mode automatique, si le système bascule clair/sombre pendant que l'app est ouverte
   (heure programmée sur l'iPhone par exemple), on suit le changement sans attendre une réouverture. */
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", async ()=>{
    const settings = Object.fromEntries((await idbGetAll("settings")).map(s=>[s.key,s.value]));
    if(settings.themeAutoEnabled) applyTheme(resolveThemeName(settings.appTheme, true));
  });
}

const DATA_STORES = ["themes","projects","tasks","timeslots","habits","settings"];

async function exportAllData(){
  const data = {};
  for(const store of DATA_STORES) data[store] = await idbGetAll(store);
  const payload = {app:"Beeziday", appVersion: APP_VERSION, schemaVersion: DATA_SCHEMA_VERSION, exportedAt: new Date().toISOString(), data};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `beeziday-export-${toISODate(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* La restauration ne dépend d'aucune version précise : elle réimporte simplement les stores
   présents dans le fichier, ce qui la rend compatible même si l'app a évolué depuis l'export. */
async function restoreAllData(payload){
  for(const store of DATA_STORES){
    await idbClear(store);
    const records = Array.isArray(payload.data[store]) ? payload.data[store] : [];
    for(const record of records) await idbPut(store, record);
  }
}

/* =========================================================================
   EVENTS per screen
   Toutes les requêtes sont scopées à "root" (l'écran fraîchement rendu) et
   non à document, car pendant une transition push/pop l'ancien écran reste
   brièvement dans le DOM avec les mêmes ids (backBtn, itemList...).
   Interroger document.getElementById risquerait d'attraper le mauvais élément.
   ========================================================================= */
function attachScreenEvents(screenName, root){
  // Remis à zéro à chaque écran ; seul catDetail la réapplique dans sa propre couleur.
  const qaSend = document.getElementById("quickAddSend");
  if(qaSend) qaSend.style.background = "";

  if(screenName === "dashboard"){
    const chooseBtn = root.querySelector("#chooseCatBtn");
    if(chooseBtn) chooseBtn.addEventListener("click", openThemePickerModal);

    const planBtn = root.querySelector("#planSlotBtn");
    if(planBtn) planBtn.addEventListener("click", ()=>{
      state.stack = [{screen:"plages"}];
      renderStack();
    });

    const sel = root.querySelector("#slotThemeSelect");
    if(sel) sel.addEventListener("change", (e)=>{
      state.currentSlotThemeOverride = e.target.value;
      state.currentItemOverride = null;
      renderStack();
    });

    const alertToggle = root.querySelector("#alertSummaryToggle");
    if(alertToggle) alertToggle.addEventListener("click", ()=>{
      const wrap = root.querySelector("#alertBannerWrap");
      const isOpen = wrap.style.display !== "none";
      wrap.style.display = isOpen ? "none" : "block";
      alertToggle.classList.toggle("open", !isOpen);
    });

    const overdueToggle = root.querySelector("#overdueSummaryToggle");
    if(overdueToggle) overdueToggle.addEventListener("click", ()=>{
      const wrap = root.querySelector("#overdueBannerWrap");
      const isOpen = wrap.style.display !== "none";
      wrap.style.display = isOpen ? "none" : "block";
      overdueToggle.classList.toggle("open", !isOpen);
    });

    const filtersBtn = root.querySelector("#filtersBtn");
    if(filtersBtn) filtersBtn.addEventListener("click", openFiltersModal);

    const currentSlotBtn = root.querySelector("#currentSlotBtn");
    if(currentSlotBtn) currentSlotBtn.addEventListener("click", ()=>{
      state.currentSlotThemeOverride = null;
      state.currentItemOverride = null;
      renderStack();
    });

    const disableFiltersBtn = root.querySelector("#disableFiltersBtn");
    if(disableFiltersBtn) disableFiltersBtn.addEventListener("click", ()=>{
      disableAllDashboardFilters();
      renderStack();
    });

    const showAll = root.querySelector("#showAllTasksLink");
    if(showAll) showAll.addEventListener("click", ()=>{
      state.stack = [{screen:"cats"}, {screen:"projectDetail", projectId: showAll.dataset.project}];
      state.projetsStackMemory = [...state.stack];
      renderStack();
    });

    const skipBtn = root.querySelector("#skipNextBtn");
    if(skipBtn) skipBtn.addEventListener("click", async ()=>{
      const itemKind = skipBtn.dataset.itemKind;
      const currentId = skipBtn.dataset.currentId;
      const nextId = skipBtn.dataset.nextId;
      if(itemKind === "project"){
        // Les deux sont des sous-tâches du même projet : on échange simplement leur ordre
        const tasks = await idbGetAll("tasks");
        const cur = tasks.find(t=>t.id===currentId);
        const nxt = tasks.find(t=>t.id===nextId);
        if(cur && nxt){
          const tmp = cur.order;
          cur.order = nxt.order;
          nxt.order = tmp;
          await idbPut("tasks", cur);
          await idbPut("tasks", nxt);
        }
      } else {
        // La tâche en cours est une tâche seule : on force juste l'affichage sur le suivant,
        // la tâche en cours redeviendra naturellement "prochaine tâche" au prochain calcul.
        state.currentItemOverride = nextId;
      }
      renderStack();
    });

    root.querySelectorAll("[data-checktask]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        await toggleTaskDone(el.dataset.checktask);
        renderStack();
      });
    });

/* Place le curseur texte à l'endroit précis du clic (plutôt qu'au début ou à la fin) */
function placeCaretAtPoint(x, y){
  let range = null;
  if(document.caretRangeFromPoint){
    range = document.caretRangeFromPoint(x, y);
  } else if(document.caretPositionFromPoint){
    const pos = document.caretPositionFromPoint(x, y);
    if(pos){ range = document.createRange(); range.setStart(pos.offsetNode, pos.offset); }
  }
  if(range){
    const sel = window.getSelection();
    sel.removeAllRanges();
    range.collapse(true);
    sel.addRange(range);
  }
}

/* Édition en ligne du titre ou de la description d'une tâche, directement sur l'élément affiché
   (contenteditable) : le texte garde exactement sa mise en forme normale (retour à la ligne
   compris), et le curseur se place là où on a tapé plutôt que de tout sélectionner. */
function startInlineEdit(el, taskId, field, clickX, clickY){
  const row = el.closest(".item-row");

  if(field === "description"){
    startInlineDescTextarea(el, taskId, row);
    return;
  }

  let original = el.textContent;

  // Le focus doit rester synchrone, dans le même geste utilisateur, sinon le clavier ne s'affiche
  // pas sur mobile (iOS notamment coupe l'activation si un await passe avant le focus()).
  el.contentEditable = "true";
  el.classList.add("inline-editing");
  if(row) row.classList.add("editing-lock");
  el.focus();
  placeCaretAtPoint(clickX, clickY);

  let done = false;
  const finishEdit = async (cancel)=>{
    if(done) return;
    done = true;
    el.contentEditable = "false";
    el.classList.remove("inline-editing");
    if(row) row.classList.remove("editing-lock");
    if(cancel){ renderStack(); return; }
    const val = el.textContent.trim();
    if(val && val !== original){
      const task = (await idbGetAll("tasks")).find(t=>t.id===taskId);
      if(task){ task.name = val; await idbPut("tasks", task); }
    }
    renderStack();
  };
  el.addEventListener("blur", ()=>finishEdit(false), {once:true});
  el.addEventListener("keydown", (ev)=>{
    if(ev.key === "Enter"){ ev.preventDefault(); el.blur(); }
    if(ev.key === "Escape"){ ev.preventDefault(); finishEdit(true); }
  });
}

/* La description utilise un vrai <textarea> (comme dans la modale complète) plutôt qu'une zone
   contenteditable : la sélection de texte (double-tap sur un mot, glisser pour sélectionner) n'a
   jamais bien fonctionné en contenteditable ici malgré plusieurs correctifs, alors qu'elle marche
   nativement et sans souci dans un textarea. */
function startInlineDescTextarea(el, taskId, row){
  if(el.querySelector("textarea")) return;
  const domText = el.textContent;
  el.innerHTML = "";
  el.classList.add("inline-editing-host");
  if(row) row.classList.add("editing-lock");

  const textarea = document.createElement("textarea");
  textarea.className = "inline-edit-textarea";
  textarea.value = domText;
  // Hauteur de départ approximative selon la longueur du texte existant, puis ajustement
  // automatique ensuite — sinon un texte long ouvrait une zone bien plus petite que la
  // description affichée, hors de vue si on avait tapé en bas de la liste.
  textarea.rows = Math.max(3, Math.min(14, Math.ceil(domText.length / 38) + domText.split("\n").length - 1));
  el.appendChild(textarea);
  const autoGrow = ()=>{ textarea.style.height = "auto"; textarea.style.height = (textarea.scrollHeight + 2) + "px"; };
  textarea.addEventListener("input", autoGrow);
  autoGrow();
  // Focus synchrone (même geste utilisateur) pour que le clavier s'affiche sur mobile.
  textarea.focus();
  textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  // Laisse l'animation du clavier démarrer avant de faire défiler, sinon la position calculée
  // ne tient pas compte de l'espace qu'il va prendre.
  setTimeout(()=>{ textarea.scrollIntoView({block:"center", behavior:"smooth"}); }, 250);

  // Récupère le texte brut réel (retours à la ligne compris) en tâche de fond.
  idbGetAll("tasks").then(tasks=>{
    const task = tasks.find(t=>t.id===taskId);
    if(task && document.activeElement === textarea && textarea.value !== (task.description||"")){
      textarea.value = task.description || "";
      autoGrow();
    }
  });

  let done = false;
  const finishEdit = async (cancel)=>{
    if(done) return;
    done = true;
    if(row) row.classList.remove("editing-lock");
    state.keepDescOpenFor = taskId;
    if(cancel){ renderStack(); return; }
    const val = textarea.value.trim();
    const task = (await idbGetAll("tasks")).find(t=>t.id===taskId);
    if(task){ task.description = val; await idbPut("tasks", task); }
    renderStack();
  };
  textarea.addEventListener("blur", ()=>finishEdit(false), {once:true});
  textarea.addEventListener("keydown", (ev)=>{
    if(ev.key === "Escape"){ ev.preventDefault(); finishEdit(true); }
  });
}

/* =========================================================================
   Modale générique (modifier / supprimer)
   ========================================================================= */
let modalOutsideClickHandler = null;
function openModal(html){
  const box = document.getElementById("modalBox");
  box.innerHTML = html;
  box.scrollTop = 0;
  document.getElementById("modalOverlay").style.display = "flex";
}
function closeModal(){
  document.getElementById("modalOverlay").style.display = "none";
  document.getElementById("modalBox").innerHTML = "";
  modalOutsideClickHandler = null;
}
document.getElementById("modalOverlay").addEventListener("click", (e)=>{
  if(e.target.id === "modalOverlay"){
    if(modalOutsideClickHandler) modalOutsideClickHandler();
    else closeModal();
  }
});

/* Suppression en 2 clics (pas de confirm() natif, qui ne fonctionne pas dans un aperçu en iframe) */
function attachTwoStepDelete(btn, onConfirm){
  let armed = false;
  btn.addEventListener("click", ()=>{
    if(!armed){
      armed = true;
      btn.textContent = "Confirmer la suppression";
      btn.classList.add("armed");
    } else {
      onConfirm();
    }
  });
}

async function openItemModal(kind, existing, context){
  context = context || {};
  // La catégorie ne se change que pour les projets et les tâches seules (pas les sous-tâches, qui héritent de leur projet)
  const showCategory = !(existing && existing.projectId) && !context.projectId;
  let themesList = [];
  if(showCategory) themesList = (await idbGetAll("themes")).filter(t=>t.forProjects).sort((a,b)=>(a.order||0)-(b.order||0));

  // Détermine la catégorie actuelle de la tâche, pour proposer les projets où on peut la déplacer
  let projectsList = [];
  if(kind === "task"){
    let currentThemeId = null;
    if(existing && existing.projectId){
      const proj = (await idbGetAll("projects")).find(p=>p.id===existing.projectId);
      currentThemeId = proj ? proj.themeId : null;
    } else if(existing){
      currentThemeId = existing.themeId;
    } else {
      currentThemeId = context.themeId || null;
    }
    if(currentThemeId){
      projectsList = (await idbGetAll("projects")).filter(p=>p.themeId === currentThemeId && p.status !== "idea");
    }
  }

  modalContext = {kind, existing, context, showCategory};
  openModal(itemFormHtml(kind, existing, showCategory, themesList, projectsList));
  document.getElementById("mPriority").value = existing ? (existing.priority || "aucune") : "aucune";
  if(kind === "task"){
    const recSelect = document.getElementById("mRecurrence");
    recSelect.value = (existing && existing.deadline && existing.recurrence) ? existing.recurrence : "aucune";
    const projSelect = document.getElementById("mProject");
    if(projSelect) projSelect.value = (existing && existing.projectId) || (context.projectId || "");
  }
  if(showCategory){
    document.getElementById("mTheme").value = existing ? existing.themeId : (context.themeId || "default");
  }
  document.getElementById("mCancel").addEventListener("click", closeModal);
  document.getElementById("mSave").addEventListener("click", saveItemModal);
  modalOutsideClickHandler = saveItemModal;

  function updateRecurrenceState(){
    const recSelect = document.getElementById("mRecurrence");
    const deadlineInput = document.getElementById("mDeadline");
    if(!recSelect || !deadlineInput) return;
    const has = !!deadlineInput.value;
    recSelect.disabled = !has;
    let noneOption = recSelect.querySelector('option[value="__none__"]');
    if(!has){
      if(!noneOption){
        noneOption = document.createElement("option");
        noneOption.value = "__none__";
        noneOption.textContent = tr("pasEcheanceDef");
        recSelect.insertBefore(noneOption, recSelect.firstChild);
      }
      recSelect.value = "__none__";
    } else {
      if(noneOption) noneOption.remove();
      if(!recSelect.value || recSelect.value === "__none__"){
        recSelect.value = existing ? (existing.recurrence || "aucune") : "aucune";
      }
    }
  }
  if(kind === "task") updateRecurrenceState();

  function updateScheduledState(){
    const schedBtn = document.getElementById("mScheduledToggle");
    const deadlineInput = document.getElementById("mDeadline");
    if(!schedBtn || !deadlineInput) return;
    const has = !!deadlineInput.value;
    schedBtn.disabled = !has;
    if(!has) schedBtn.classList.remove("on");
  }
  if(kind === "task") updateScheduledState();

  document.getElementById("mDeadlineClear").addEventListener("click", ()=>{
    document.getElementById("mDeadline").value = "";
    updateRecurrenceState();
    updateScheduledState();
  });
  const deadlineInput = document.getElementById("mDeadline");
  if(deadlineInput && kind === "task"){
    deadlineInput.addEventListener("change", ()=>{
      updateRecurrenceState();
      updateScheduledState();
    });
  }
  const scheduledToggle = document.getElementById("mScheduledToggle");
  if(scheduledToggle) scheduledToggle.addEventListener("click", ()=>{
    if(scheduledToggle.disabled) return;
    scheduledToggle.classList.toggle("on");
  });
  const starToggle = document.getElementById("mStarredToggle");
  if(starToggle){
    starToggle.addEventListener("click", ()=>{
      const active = starToggle.classList.toggle("active");
      starToggle.setAttribute("aria-pressed", active);
    });
  }
  const linkedToggle = document.getElementById("mLinkedToggle");
  if(linkedToggle) linkedToggle.addEventListener("click", ()=> linkedToggle.classList.toggle("on"));
  const delBtn = document.getElementById("mDelete");
  if(delBtn){
    if(kind === "task" && existing && existing.recurrence && existing.recurrence !== "aucune"){
      delBtn.addEventListener("click", ()=>{
        confirmAndDeleteTask(existing.id, ()=>{
          const top = state.stack[state.stack.length-1];
          if(top.screen === "projectDetail" && top.projectId === existing.id) popScreen();
          else renderStack();
        });
      });
    } else if(kind === "project"){
      delBtn.addEventListener("click", ()=>{
        confirmAndDeleteProject(existing.id, ()=>{
          const top = state.stack[state.stack.length-1];
          if(top.screen === "projectDetail" && top.projectId === existing.id) popScreen();
          else renderStack();
        });
      });
    } else {
      attachTwoStepDelete(delBtn, async ()=>{
        await idbDelete("tasks", existing.id);
        closeModal();
        const top = state.stack[state.stack.length-1];
        if(top.screen === "projectDetail" && top.projectId === existing.id) popScreen();
        else renderStack();
      });
    }
  }
}

let savingItemModalNow = false;
async function saveItemModal(){
  if(savingItemModalNow) return;
  savingItemModalNow = true;
  try{
    const {kind, existing, context, showCategory} = modalContext;
    if(!kind){ return; }
    const name = document.getElementById("mName").value.trim();
    if(!name) return;
    const deadline = document.getElementById("mDeadline").value || null;
    const priority = document.getElementById("mPriority").value;
    const store = kind === "project" ? "projects" : "tasks";
    const obj = existing ? {...existing} : {
      id: uid(), status: "active", order: Date.now(),
      themeId: context.themeId || "default",
      projectId: context.projectId || null
    };
    obj.name = name;
    obj.deadline = deadline;
    obj.priority = priority;
    if(showCategory){
      obj.themeId = document.getElementById("mTheme").value;
    }
    if(kind === "task"){
      obj.recurrence = deadline ? (document.getElementById("mRecurrence").value || "aucune").replace("__none__","aucune") : "aucune";
      const starToggle = document.getElementById("mStarredToggle");
      obj.starred = starToggle ? starToggle.classList.contains("active") : false;
      obj.description = document.getElementById("mDescription").value.trim();
      const linkedToggleEl = document.getElementById("mLinkedToggle");
      obj.linkedToPrevious = linkedToggleEl ? linkedToggleEl.classList.contains("on") : false;
      const scheduledToggleEl = document.getElementById("mScheduledToggle");
      obj.scheduled = scheduledToggleEl ? scheduledToggleEl.classList.contains("on") : false;
      const projSelect = document.getElementById("mProject");
      if(projSelect){
        const chosenProjectId = projSelect.value || null;
        obj.projectId = chosenProjectId;
        if(chosenProjectId){
          const proj = (await idbGetAll("projects")).find(p=>p.id===chosenProjectId);
          if(proj) obj.themeId = proj.themeId;
        }
      }
    }
    await idbPut(store, obj);
    closeModal();
    renderStack();
  } finally {
    savingItemModalNow = false;
  }
}

function openCatEditModal(theme){
  let selectedColor = theme.color;
  openModal(catEditFormHtml(theme));
  document.querySelectorAll("#mCatSwatches .swatch").forEach(sw=>{
    sw.addEventListener("click", ()=>{
      document.querySelectorAll("#mCatSwatches .swatch").forEach(s=>s.classList.remove("selected"));
      sw.classList.add("selected");
      selectedColor = sw.dataset.color;
    });
  });
  const separateSwitch = document.getElementById("mCatSeparateUpcoming");
  separateSwitch.addEventListener("click", ()=> separateSwitch.classList.toggle("on"));

  const saveCatModal = async ()=>{
    const name = document.getElementById("mCatName").value.trim();
    if(!name) return;
    if(name !== themeDisplayName(theme)) theme.nameCustomized = true;
    theme.name = name; theme.color = selectedColor;
    theme.sortMode = document.getElementById("mCatSortMode").value;
    theme.separateUpcoming = separateSwitch.classList.contains("on");
    await idbPut("themes", theme);
    closeModal();
    renderStack();
  };
  document.getElementById("mCatCancel").addEventListener("click", closeModal);
  document.getElementById("mCatSave").addEventListener("click", saveCatModal);
  modalOutsideClickHandler = saveCatModal;

  const delBtn = document.getElementById("mCatDelete");
  if(delBtn){
    attachTwoStepDelete(delBtn, async ()=>{
      // Les projets/tâches de cette catégorie sont réaffectés à "Non classé", jamais supprimés
      const projects = await idbGetAll("projects");
      const tasks = await idbGetAll("tasks");
      for(const p of projects) if(p.themeId === theme.id){ p.themeId = "default"; await idbPut("projects", p); }
      for(const t of tasks) if(t.themeId === theme.id){ t.themeId = "default"; await idbPut("tasks", t); }
      await idbDelete("themes", theme.id);
      closeModal();
      state.stack = [{screen:"cats"}];
      renderStack();
    });
  }
}
